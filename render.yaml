services:
  - type: web
    name: noble-education-erp-api
    env: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma db push && npx tsx prisma/seed.ts && npx tsx prisma/seed_rich_data.ts && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
